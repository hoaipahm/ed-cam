<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ảnh từ Ed-Cam</title>
<style>
* {
    box-sizing: border-box
}

body {
    margin: 0;
    background: #141313;
    color: #fff;
    font: 16px system-ui
}

main {
    max-width: 560px;
    margin: auto;
    padding: 20px
}

header {
    font-size: 20px;
    font-weight: 650;
    margin-bottom: 16px
}

img {
    display: block;
    width: 100%;
    height: 60vh;
    object-fit: contain;
    background: #080808;
    touch-action: pan-y
}

nav {
    display: flex;
    gap: 8px;
    overflow: auto;
    padding: 14px 0
}

button {
    background: #342f2c;
    border: 0;
    color: white;
    border-radius: 16px;
    padding: 12px 16px;
    min-height: 48px
}

button[aria-pressed=true],
#vote {
    background: #f5cf75;
    color: #272116
}

p {
    min-height: 1.5em
}
</style>
<body>
<main>
<header>Ed-Cam</header>
<img id="photo" alt="Ảnh được chia sẻ">
<nav aria-label="Chọn bản màu">
</nav>
<button id="vote" hidden>Chọn màu này</button>
<p role="status">
</p>
</main>
<script>
const root = location.pathname,
    photo = document.querySelector('img'),
    nav = document.querySelector('nav'),
    vote = document.querySelector('#vote'),
    statusLine = document.querySelector('p');
let labels = [],
    selected = 0,
    touch = 0;

function show(i) {
    selected = i;
    photo.src = root + '/' + i;
    photo.alt = labels[i];
    [...nav.children].forEach((b, n) => b.setAttribute('aria-pressed', String(n === i)));
}
fetch(root + '/info').then(r => r.json()).then(data => {
    labels = data.labels;
    labels.forEach((s, i) => {
        const b = document.createElement('button');
        b.textContent = s;
        b.onclick = () => show(i);
        nav.append(b);
    });
    show(0);
    vote.hidden = labels.length < 2;
}).catch(() => statusLine.textContent = 'Liên kết đã hết hạn hoặc không tải được ảnh.');
photo.ontouchstart = e => touch = e.changedTouches[0].clientX;
photo.ontouchend = e => {
    const d = e.changedTouches[0].clientX - touch;
    if (Math.abs(d) > 36) show(Math.max(0, Math.min(labels.length - 1, selected + (d < 0 ? 1 : -1))));
};
vote.onclick = async () => {
    try {
        let id = localStorage.getItem(root);
        if (!id) {
            id = crypto.randomUUID();
            localStorage.setItem(root, id);
        }
        const name = labels[selected];
        const r = await fetch(root + '/vote', {
            method: 'POST',
            headers: {
                'X-Edcam-Voter': id,
                'X-Edcam-Choice': String(selected)
            }
        });
        if (!r.ok) throw Error();
        statusLine.textContent = 'Đã chọn ' + name + '.';
    } catch {
        statusLine.textContent = 'Chưa gửi được lựa chọn. Hãy thử lại.';
    }
};
</script>
</body>
</html>
